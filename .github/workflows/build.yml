name: Build Samsung Remote APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # গ্রেডল প্রি-ইনস্টল করা (ক্যাশ বা ফেইলিয়র ছাড়া)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-disabled: true

      # সরাসরি গ্রেডল দিয়ে বিল্ড (রানার আর gradle.org-এ ডাউনলোড রিকোয়েস্ট পাঠাবে না)
      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SamsungRemote-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
