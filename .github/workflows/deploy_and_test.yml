name: Build, Distribute & Test Samsung Remote

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Locate Project & Build Debug APK
        id: build_step
        run: |
          # প্রজেক্ট রুট বা কোনো সাব-ফোল্ডারে আছে কিনা তা নিশ্চিত করা
          if [ -f "./gradlew" ]; then
            echo "Building from root..."
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
            echo "apk_dir=app/build/outputs/apk/debug" >> $GITHUB_ENV
          elif [ -f "./android/gradlew" ]; then
            echo "Building from android/ subdirectory..."
            chmod +x ./android/gradlew
            cd android
            ./gradlew assembleDebug --no-daemon
            cd ..
            echo "apk_dir=android/app/build/outputs/apk/debug" >> $GITHUB_ENV
          else
            # যদি gradlew ফাইলটি গিট ট্র্যাকিংয়ে মিসিং থাকে, তাহলে র‍্যাপার জেনারেট করে বিল্ড করবে
            echo "Wrapper missing, generating compatible wrapper..."
            gradle wrapper --gradle-version 8.7
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
            echo "apk_dir=app/build/outputs/apk/debug" >> $GITHUB_ENV
          fi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ env.apk_dir }}/app-debug.apk

  distribute:
    name: Firebase App Distribution (Real TV Test)
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Built APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug
          path: apk-output

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          groups: internal-testers
          file: apk-output/app-debug.apk
          releaseNotes: "Build commit: ${{ github.sha }}"

  test-lab:
    name: Firebase Test Lab (Robo Test)
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Built APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug
          path: apk-output

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Run Firebase Robo Test
        run: |
          gcloud firebase test android run \
            --type robo \
            --app apk-output/app-debug.apk \
            --device model=oriole,version=33,locale=en,orientation=portrait \
            --timeout 2m
