name: Build and Distribute Samsung Remote

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
            echo "apk_dir=app/build/outputs/apk/debug" >> $GITHUB_ENV
          elif [ -f "./android/gradlew" ]; then
            chmod +x ./android/gradlew
            cd android && ./gradlew assembleDebug --no-daemon && cd ..
            echo "apk_dir=android/app/build/outputs/apk/debug" >> $GITHUB_ENV
          fi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ env.apk_dir }}/app-debug.apk

  distribute:
    name: Firebase App Distribution
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Built APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug
          path: apk-output

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          groups: internal-testers
          file: apk-output/app-debug.apk
          releaseNotes: "Build commit: ${{ github.sha }}"
