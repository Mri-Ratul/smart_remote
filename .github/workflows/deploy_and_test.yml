name: Build and Distribute Samsung Remote

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build_and_distribute:
    name: Build & Upload to Firebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          elif [ -f "./android/gradlew" ]; then
            chmod +x ./android/gradlew
            cd android && ./gradlew assembleDebug --no-daemon && cd ..
          else
            gradle wrapper --gradle-version 8.7
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          fi

      # বিল্ড হওয়া APK-এর সঠিক লোকেশন খুঁজে বের করা
      - name: Locate Built APK
        id: find_apk
        run: |
          APK_PATH=$(find . -name "app-debug.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_ENV

      # সরাসরি ফায়ারবেসে আপলোড
      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          groups: internal-testers
          file: ${{ env.apk_path }}
          releaseNotes: "Build commit: ${{ github.sha }}"
